[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yt-to-jellyfin"
version = "0.1.0"
description = "Lightweight YouTube archiver built for native Jellyfin TV Show libraries"
readme = "README.md"
requires-python = ">=3.13"
license = "WTFPL"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "yt-dlp>=2025.1.1",
  "httpx>=0.27",
  "defusedxml>=0.7.1",
]

[project.scripts]
migrate-tubearchivist = "app.migration.tubearchivist:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
"app/main.py" = ["B008"]
"app/api/*" = ["B008"]
"app/api/endpoints/*" = ["B008"]
