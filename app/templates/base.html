<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}yt-to-jellyfin{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  {% set lib_qs = '?lib=' ~ (current_lib|urlencode) if current_lib and current_lib != 'all' else '' %}
  <header>
    <div class="header-container">
      <a href="/{{ lib_qs }}" class="logo">
        <span>🎬</span> yt-to-jellyfin
      </a>

      <!-- Library Switcher Pills: the active library lives in the URL (?lib=) only -->
      <div class="library-switcher" id="lib-switcher">
        <a href="{{ request.url.path }}" class="lib-pill {% if not current_lib or current_lib == 'all' %}active{% endif %}">🌐 Alle</a>
        {% for lib in library_options() %}
        <a href="{{ request.url.path }}?lib={{ lib.name|urlencode }}" class="lib-pill {% if current_lib == lib.name %}active{% endif %}">{{ lib.icon }} {{ lib.label }}</a>
        {% endfor %}
      </div>

      <nav class="nav-links">
        <a href="/{{ lib_qs }}" class="nav-link {% if active_page == 'home' %}active{% endif %}">Download</a>
        <a href="/browser{{ lib_qs }}" class="nav-link {% if active_page == 'browser' %}active{% endif %}">Mediathek</a>
        <a href="/subscriptions{{ lib_qs }}" class="nav-link {% if active_page == 'subscriptions' %}active{% endif %}">Abos</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
