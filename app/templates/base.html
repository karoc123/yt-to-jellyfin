<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}yt-to-jellyfin{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="/" class="logo">
        <span>🎬</span> yt-to-jellyfin
      </a>

      <!-- Library Switcher Pills -->
      <div class="library-switcher" id="lib-switcher">
        <button type="button" class="lib-pill" data-lib="all">🌐 Alle</button>
        {% for lib in library_options() %}
        <button type="button" class="lib-pill" data-lib="{{ lib.name }}">{{ lib.icon }} {{ lib.label }}</button>
        {% endfor %}
      </div>

      <nav class="nav-links">
        <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">Download</a>
        <a href="/browser" class="nav-link {% if active_page == 'browser' %}active{% endif %}">Mediathek</a>
        <a href="/subscriptions" class="nav-link {% if active_page == 'subscriptions' %}active{% endif %}">Abos & Queue</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
