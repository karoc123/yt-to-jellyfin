{% extends "base.html" %}
{% from "components/ui.html" import icon, scope with context %}

{% block title %}Quick Download - yt-to-jellyfin{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Download</h1>
  {{ scope() }}
</div>

<form action="/api/downloads" method="POST">
  <div class="cmd-field">
    {{ icon('link') }}
    <input type="url" name="url" required autocomplete="off" aria-label="YouTube link" placeholder="Paste a YouTube video, Shorts or playlist link">
    <input type="hidden" name="library" value="{{ current_lib if current_lib and current_lib != 'all' else 'default' }}">
    <button type="submit" class="btn btn-primary">Download</button>
  </div>
  <div class="cmd-opts">
    <label class="opt">Save to
      <select name="target_library">
        {% for lib in library_options() %}
        <option value="{{ lib.name }}" {% if current_lib == lib.name %}selected{% endif %}>{{ lib.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="opt">Quality
      <select name="max_height">
        <option value="">Best available</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="sponsorblock" value="1" checked> Remove sponsor segments</label>
  </div>
</form>

{% include "components/queue.html" %}
{% endblock %}
