{% extends "base.html" %}

{% block title %}Quick Download - yt-to-jellyfin{% endblock %}

{% block content %}
<div class="download-card">
  <h2 style="margin-bottom: 12px; font-size: 1.25rem;">Schnell-Download</h2>
  <form action="/api/downloads" method="POST" class="download-form">
    <div class="download-form-row">
      <input
        type="url"
        name="url"
        placeholder="YouTube-Video-, Shorts- oder Playlist-Link einfügen..."
        required
        class="url-input"
        autocomplete="off"
      >
      <input type="hidden" name="library" value="{{ current_lib or 'default' }}">
      <button type="submit" class="btn">
        <span>⬇️</span> Herunterladen
      </button>
    </div>

    <div>
      <button type="button" class="options-toggle" onclick="toggleAdvancedOptions()">
        ⚙️ Zusätzliche Optionen (Auflösung, SponsorBlock, Ziel-Bibliothek)
      </button>
    </div>

    <div class="advanced-options" id="advanced-options">
      <div>
        <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px;">Ziel-Bibliothek:</label>
        <select name="target_library" class="url-input" style="padding: 8px;">
          {% for lib in library_options() %}
          <option value="{{ lib.name }}" {% if current_lib == lib.name %}selected{% endif %}>{{ lib.label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px;">Max. Auflösung:</label>
        <select name="max_height" class="url-input" style="padding: 8px;">
          <option value="">Beste Qualität (Original)</option>
          <option value="1080">1080p (Full HD)</option>
          <option value="720">720p (HD)</option>
          <option value="480">480p (SD)</option>
        </select>
      </div>

      <div>
        <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px;">SponsorBlock:</label>
        <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" name="sponsorblock" value="1" checked> Sponsoren automatisch herausschneiden
        </label>
      </div>
    </div>
  </form>
</div>

{% include "components/queue.html" %}
{% endblock %}
