services:
  yt-to-jellyfin:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-to-jellyfin:latest
    container_name: yt-to-jellyfin
    restart: unless-stopped
    ports:
      - "8099:8000"
    environment:
      - DATABASE_PATH=/data/app.db
      - MEDIA_PATH=/media
      - TZ=Europe/Berlin
      # Optional: Netscape cookies.txt path for age/member-restricted videos
      # - COOKIES_PATH=/cookies/cookies.txt
      # Optional: TubeArchivist-style format sort (e.g. res:1080,fps,codec:h264)
      # - FORMAT_SORT=res:1080,fps
      # Optional: re-extract downloads slower than N bytes/sec (e.g. 5242880 = 5 MB/s)
      # - THROTTLED_RATE_BYTES=5242880
    volumes:
      - ./data:/data
      - ./media:/media
      # Optional: Mount cookies file as read-only
      # - ./cookies.txt:/cookies/cookies.txt:ro
